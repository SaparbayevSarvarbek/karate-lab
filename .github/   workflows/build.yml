name: Build APK and upload to telegram

on:
  push:
    branches:
      - main
      - dev
      - prod

jobs:
  code_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set Environment Constants (for dev only)
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: sed -i 's/static const bool _isTester = false;/static const bool _isTester = true;/g' lib/core/network/service/api_const.dart

      - name: Set Environment Constants (for prod/main)
        if: ${{ github.ref != 'refs/heads/dev' }}
        run: sed -i 's/static const bool _isTester = true;/static const bool _isTester = false;/g' lib/core/network/service/api_const.dart

      - name: Build APK (Split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Set APK name dynamically
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BRANCH="${GITHUB_REF##*/}"
          APPNAME="joy-top_${BRANCH}_v${VERSION}.apk"
          echo "APPNAME=$APPNAME" >> $GITHUB_ENV

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/${{ env.APPNAME }}

      - name: Send success notification with custom-named APK
        if: ${{ success() }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO_BUILD }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          document: build/app/outputs/flutter-apk/${{ env.APPNAME }}
          format: html
          message: |
            <b>✅ Build Successful</b> 🎉
            👤 <b>${{ github.actor }}</b> pushed to <code>${{ github.ref_name }}</code>
            📱 APK: <code>${{ env.APPNAME }}</code> attached.
            <blockquote>
            🟢📳 User <b>${{ github.actor }}</b> created PR.
            🟢📳 Repository: <code>${{ github.repository }}</code>
            🟢📳 PR Name: <b>${{ github.event.pull_request.title }}</b>
            🟢📳 Source branch: <code>${{ github.head_ref }}</code>
            🟢📳 Last commit: <a href="https://github.com/${{ github.repository }}/commit/${{github.sha}}">link</a>
            </blockquote>
            
            🟢📳 See changes in PR: <a href="${{ github.event.pull_request.html_url }}">${{ github.event.pull_request.title }}</a>

      - name: Send error telegram notification
        if: ${{ failure() }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO_BUILD }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            <b>❌ Build Failed</b> 🚨
            👤 <b>${{ github.actor }}</b> pushed to <code>${{ github.ref_name }}</code>
            🔗 <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">View commit</a>
